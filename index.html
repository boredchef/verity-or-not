<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <script defer type="module" src="javascript/questions.js"></script>
    <script defer type="module" src="javascript/script.js"></script>
    <link rel="icon" type="image/png" href="assets/smile.png">
    <title>verity or not</title>
</head>
<body>
    <div id="container" class="container">
        <div id="start-screen" class="">
            <h1>verity or not</h1>
            <p>lets test those thinking skills</p>
            <button id="start-btn" class="start-btn btn">start game</button>
            <div id="categories" class="btn-grid hide">
                <button id="math" class="btn">math</button>
                <button id="sports" class="btn">sports</button>
                <button id="science" class="btn">science</button>
            </div>
        </div>

        <div id="question-container" class="hide">
            <div id="question">Question</div>
            <div id="answer-buttons" class="btn-grid">
                <!-- where question go -->
            </div>
            <div class="progress-timer">
                <div id="timer-bar"></div>
            </div>
            <button id="next-btn" class="next-btn btn hide">next question</button>
        </div>
        
        <div id="score-container" class="hide">
            <h3 id="verdict"></h3>
            <div class="scores">
                Score: <span id="score">0</span>
                Highscore: <span id="highscore">0</span>
            </div>
            <div class="score-btns">
                <button id="restart-btn" class="restart-btn btn">restart game</button>
                <button id="review-btn" class="review-btn btn">review answers</button>
            </div>
        </div>
    </div>
    <div id="review-container" class="review-container hide">
        <button id="back-btn" class="back-btn btn">go back!!!</button>
        <div id="review-list">

        </div>
    </div>
</body>
</html>
