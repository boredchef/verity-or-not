<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <script defer type="module" src="javascript/questions.js"></script>
    <script defer type="module" src="javascript/script.js"></script>
    <link rel="icon" type="image/png" href="assets/smile.png">
    <title>verity or not</title>
</head>
<body>
    <div id="container" class="container">
        <div id="start-screen" class="">
            <h1>verity or not</h1>
            <p>lets test those thinking skills</p>
            <button id="start-btn" class="start-btn btn">start game</button>
            <form id="user-response" class="hide">
                <div class="response">
                    <label for="category">category</label>
                    <select id="category" name="category">
                        <option value="general" selected>general</option>
                        <option value="sports">sports</option>
                        <option value="science">science</option>
                        <option value="math">math</option>
                    </select>

                    <label for="question-count">how many?</label>
                    <input class="slider-look" type="range" id="question-count" name="question-count" min="1" max="50" value="10" required><br>
                    <output for="question-count" id="sliderValue">10</output>
                </div>
                <button type="submit">go!</button>
            </form>
        </div>

        <div id="question-container" class="hide">
            <div id="question">Question</div>
            <div id="answer-buttons" class="btn-grid">
                <!-- where question go -->
            </div>
            <div class="progress-timer">
                <div id="timer-bar"></div>
            </div>
            <button id="next-btn" class="next-btn btn hide">next question</button>
            <button id="quit-btn" class="quit-btn btn">🔄</button>
        </div>
        
        <div id="score-container" class="hide">
            <h3 id="verdict"></h3>
            <div class="scores">
                Score: <span id="score">0</span>
                Highscore: <span id="highscore">0</span>
            </div>
            <div class="score-btns">
                <button id="restart-btn" class="restart-btn btn">restart game</button>
                <button id="review-btn" class="review-btn btn">review answers</button>
            </div>
        </div>
    </div>
    <div id="review-container" class="review-container hide">
        <button id="back-btn" class="back-btn btn">go back!!!</button>
        <div id="review-list">

        </div>
    </div>

    <dialog id="confirm-dialog">
        <div class="dialog">
            <h2>are you sure?</h2>
            <p>clicking YES will reset progress!</p>

            <button id="confirm-dialog-yes">YES!</button>
            <button id="confirm-dialog-no">NO!</button>
        </div>
    </dialog>
</body>
</html>
