<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <script defer type="module" src="questions.js"></script>
    <script defer type="module" src="script.js"></script>
    <title>Verity or not</title>
</head>
<body>
    <div class="container">
        <h1>verity or not</h1>
        <div id="start-screen" class="">
            <p>lets test those thinking skills</p>
            <button id="start-btn" class="start-btn btn">start game</button>
        </div>

        <div id="question-container" class="hide">
            <div id="score-container" class="hide">
                <div id="highscore">0</div>
                <div id="score">0</div>
            </div>
            <div id="question">Question</div>
            <div id="answer-buttons" class="btn-grid">
                <button class="btn">Answer 1</button>
                <button class="btn">Answer 2</button>
                <button class="btn">Answer 3</button>
                <button class="btn">Answer 4</button>
            </div>
            <button id="next-btn" class="next-btn btn hide">next question</button>
        </div>
    </div>
</body>
</html>
